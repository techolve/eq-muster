[project]
name = "eq-muster"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "websockets",
    "httpx",
    "python-dotenv",
]

[project.scripts]
eq-muster = "eq_muster.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eq_muster"]
